[package]
name = "hash-hunter-app"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "hash_hunter_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hash-hunter = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
